<!DOCTYPE html>

    <title>السور القرآنية - عمر أحمد الحنيطي</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

<body>

    <aside class="sidebar">
        <div class="sidebar-title">أقسام الموقع</div>
        <a href="index.html" class="nav-btn">🏠 الواجهة الرئيسية</a>

    <div class="main-content">
        <main class="container" style="padding-top: 30px;">
            <section class="card">
                <h2><span class="icon">📖</span> السور القرآنية المسموعة والمكتوبة (بأصوات متعددة القراء)</h2>
                <div class="quran-container">

                    <!-- سورة الفاتحة -->
                    <div class="quran-item">
                        <h3>سورة الفاتحة</h3>
                        <div class="reciter-select">
                            <label>اختر القارئ: </label>
                            <select onchange="changeAudio('fatiha', this.value)">
                                <option value="https://server6.mp3quran.net/thubti/001.mp3">عبد الباسط عبد الصمد</option>
                                <option value="https://server8.mp3quran.net/afs/001.mp3">مشاري العفاسي</option>
                                <option value="https://server13.mp3quran.net/hussary/001.mp3">محمود خليل الحصري</option>
                            </select>
                        </div>
                        <audio id="audio-fatiha" controls preload="none">
                            <source src="https://server6.mp3quran.net/thubti/001.mp3" type="audio/mpeg">
                        </audio>
                    </div>

                    <!-- سورة يس -->
                    <div class="quran-item">
